[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pre-commit==4.6.2",
    "pytest-httpx==0.36.2",
    "pytest==9.0.3",
    "ruff==0.16.5",
    "types-PyYAML>=6.0.12",
]

[project]
authors = [
    {email = "max.callaghan@pik-potsdam.de", name = "Max Callaghan"},
    {email = "tim.repke@pik-potsdam.de", name = "Tim Repke"},
]
dependencies = [
    "destiny-sdk>=0.16.0",
    "httpx>=0.28.0,<0.29.0",
    "litellm>=1.96.2",
    "pydantic-settings>=2.14.1,<3",
    "pyyaml>=6.0.2",
    "scikit-learn>=1.9.0",
    "typer>=0.27.1,<1.0",
]
description = "Robot for classifying the relevance for climate and health (DESTinY IC1)"
name = "impact-case-1-robot-inclusion"
readme = "README.md"
requires-python = ">=3.14"
version = "0.1.0"

[project.scripts]
robot = "app:run"

[tool.hatch.build.targets.wheel]
packages = ["app"] # new: tell hatchling where the code is

[tool.mypy]
# for strict mypy: (this is the tricky one :-))
disallow_untyped_defs = true
exclude = []
explicit_package_bases = true
files = ['app']
plugins = ["pydantic.mypy"]
strict = true

[tool.pytest.ini_options]
addopts = ["--color=yes", "--import-mode=importlib", "--verbose"]
pythonpath = "."
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["app/migrations/versions/*.py", "docs/*.py"]
fix = true
force-exclude = true
line-length = 160
target-version = "py313"
lint.ignore = [
    "ARG002", # Unused method argument: `db_debug`
    "COM812", # trailing commas (ruff-format recommended)
    "D100", # Missing docstring in public module
    "D101", # Missing docstring in public class
    "D102", # Missing docstring in public method
    "D103", # Missing docstring in public function
    "D104", # Missing docstring in public package
    "D107", # Missing docstring in `__init__`
    "D203", # no-blank-line-before-class
    "D212", # multi-line-summary-first-line
    "D407", # removed dashes lines under sections
    "D417", # argument description in docstring (unreliable)
    "EM101", # Exception must not use a string literal, assign to variable first
    "EM102", # Exception must not use an f-string literal, assign to variable first
    "FBT001", # Boolean-typed positional argument in function definition
    "FBT002", # Boolean default positional argument in function definition
    "FIX002", # implicit trust that TODOs are not trivial, or else they would be fixed
    "G004", # Logging statement uses f-string
    "ISC001", # simplify implicit str concatenation (ruff-format recommended)
    "N806", # Variable `..` in function should be lowercase
    "TRY003", # Avoid specifying long messages outside the exception class
    "TRY400", # Use `logging.exception` instead of `logging.error
    "TRY401", # Redundant exception object included in `logging.exception` call
]
lint.per-file-ignores = {"tests*" = [
    "ANN201", # No return type annotation. It's always None for tests.
    "INP001", # File is part of an implicit namespace package.
    "PLR2004", # Magic value used in comparison
    "S101", # Use of `assert` detected
]}
lint.select = ["ALL"]
lint.mccabe.max-complexity = 18
lint.pep8-naming.classmethod-decorators = ["classmethod"]

[tool.tomlsort]
all = true
spaces_indent_inline_array = 4
trailing_comma_inline_array = true
overrides."project.classifiers".inline_arrays = false
overrides."tool.coverage.paths.source".inline_arrays = false

[tool.uv]
exclude-newer = "P5D"
exclude-newer-package = {destiny-sdk = false}
package = true
