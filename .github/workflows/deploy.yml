name: Deploy

on:
  push:
    branches: [main, feat/infra]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    env:
      IMAGE: ${{ vars.REGISTRY_SERVER }}/${{ vars.APP_NAME }}:${{ github.sha }}
      # Must match MODEL_PREFILTER in the Dockerfile (minus the /app prefix).
      MODEL_PATH: .configs/models/high-recall-svm.sklearn
    steps:
      - uses: actions/checkout@v4

      - name: Az CLI login
        uses: azure/login@v2.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The serialised model is not in git; it is pulled into the build context so
      # `COPY . .` bakes it into the image at $MODEL_PREFILTER.
      - name: Download prefilter model
        run: |
          set -euo pipefail
          if [ -z "${MODEL_BLOB_URL:-}" ]; then
            echo "MODEL_BLOB_URL is not set for this environment" >&2
            exit 1
          fi
          mkdir -p "$(dirname "$MODEL_PATH")"
          az storage blob download \
            --blob-url "$MODEL_BLOB_URL" \
            --auth-mode login \
            --file "$MODEL_PATH" \
            --no-progress \
            --only-show-errors
          test -s "$MODEL_PATH"
          echo "Downloaded $(du -h "$MODEL_PATH" | cut -f1) to $MODEL_PATH"
        env:
          MODEL_BLOB_URL: ${{ vars.MODEL_BLOB_URL }}

      - name: Build and push image
        run: |
          az acr login --name ${{ vars.REGISTRY_NAME }}
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy built image to each robot
        uses: Azure/cli@v2.0.0
        with:
          inlineScript: |
            for app in ${{ vars.CONTAINER_APP_NAMES }}; do
              az containerapp update \
                --name "$app" \
                --resource-group ${{ vars.RESOURCE_GROUP }} \
                --image ${{ env.IMAGE }}
            done
